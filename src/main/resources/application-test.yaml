spring:
  application:
    name: gestao_vagas
  datasource:
    driver-class-name: org.h2.Driver
    url: "jdbc:h2:mem:testdb"
    username: sa
    password:
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

security:
  token:
    secret:
      company: ${SECRET_KEY_COMPANY}
      candidate: ${SECRET_KEY_CANDIDATE}